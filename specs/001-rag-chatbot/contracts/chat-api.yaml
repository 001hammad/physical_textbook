openapi: 3.0.0
info:
  title: RAG Chatbot API
  version: 1.0.0
  description: API for the RAG chatbot for Physical AI & Humanoid Robotics book

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.physical-textbook.vercel.app
    description: Production server

paths:
  /chat:
    post:
      summary: Process user query and return response
      description: Handles user questions about the book content with anti-hallucination constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful response with answer from book content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []

  /status:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

components:
  schemas:
    ChatRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: The user's question about the book
          example: "What are the key principles of humanoid robotics?"
        selected_text:
          type: string
          description: Optional selected text from the book for selected-text mode
          example: "Humanoid robots are designed to mimic human form and behavior..."
        mode:
          type: string
          enum: [normal, selected-text]
          description: Interaction mode - normal for semantic search, selected-text for focused analysis
          default: normal

    ChatResponse:
      type: object
      required:
        - response_id
        - answer
        - sources
        - confidence
      properties:
        response_id:
          type: string
          description: Unique identifier for the response
          example: "resp_12345"
        answer:
          type: string
          description: The answer generated by the agent based on book content
          example: "The key principles of humanoid robotics include..."
        sources:
          type: array
          items:
            type: string
          description: List of book content IDs used to generate the answer
          example: ["ch1_introduction", "sec2_3_design_principles"]
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Confidence level in the response
          example: 0.95
        message:
          type: string
          description: Additional message when information is not available in book
          example: "Information not found in book content"

    StatusResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unavailable]
          description: Current health status
          example: "healthy"
        timestamp:
          type: string
          format: date-time
          description: When the status was checked
          example: "2025-01-20T10:00:00Z"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Question cannot be empty"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token for API authentication (if needed)